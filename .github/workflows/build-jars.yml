name: Build Kettle JARs

on:
  push:
    branches:
      - '10.1'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Build JARs
        run: mvn --batch-mode --no-transfer-progress --settings .github/maven-settings.xml -DskipTests clean install

      - name: Collect JARs
        shell: bash
        run: |
          mkdir -p build-artifacts
          while IFS= read -r -d '' jar; do
            destination="build-artifacts/${jar#./}"
            mkdir -p "$(dirname "$destination")"
            cp "$jar" "$destination"
          done < <(find . -type f -path '*/target/*.jar' -print0)
          count=$(find build-artifacts -type f -name '*.jar' | wc -l)
          echo "Collected $count JARs"
          test "$count" -gt 0

      - name: Upload JARs
        uses: actions/upload-artifact@v7
        with:
          name: kettle-jars-10.1
          path: build-artifacts/
          if-no-files-found: error
          retention-days: 90
